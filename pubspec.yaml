name: tnpsc_ai
description: Offline AI Assistant for TNPSC & Competitive Exam Preparation
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Database
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2
  
  # UI Components
  fl_chart: ^0.68.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  percent_indicator: ^4.2.3
  flutter_staggered_animations: ^1.1.1
  lottie: ^3.1.0
  
  # AI / ML
  google_generative_ai: ^0.4.6
  
  # Voice
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0
  
  # PDF
  syncfusion_flutter_pdf: ^25.1.35
  file_picker: ^8.0.0+1
  
  # Utils
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  uuid: ^4.3.3
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  flutter_local_notifications: ^17.0.0
  permission_handler: ^11.3.0
  http: ^1.2.1
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true
  
  assets:
    - assets/data/
    - assets/images/
